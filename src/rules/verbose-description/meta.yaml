id: verbose-description
title: Description is longer than it needs to be
severity: warn
category: prose
rationale: >-
  Tool and parameter descriptions are injected into every request. Long prose,
  usage examples and restatements of the parameter name cost tokens on each call
  without improving tool selection.
fix: >-
  Cut descriptions to one sentence that says what the tool does and when to pick
  it. Move examples, caveats and formatting notes into the error messages the
  tool returns, or into your README.
