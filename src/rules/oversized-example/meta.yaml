id: oversized-example
title: Embedded example or default payload is large
severity: warn
category: structure
rationale: >-
  JSON Schema examples and defaults are part of the tool definition, so a pasted
  sample payload is paid for on every single request even though it is only
  useful once.
fix: >-
  Delete the example, or shrink it to the smallest fragment that disambiguates
  the format. A one-line format hint in the description is almost always cheaper
  than a full sample object.
