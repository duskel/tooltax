name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  registry:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The schema gate is the whole review process for a registry PR. Every
      # servers/*.json must validate against schema/server.schema.json and use
      # the <owner>__<name>.json naming convention.
      - name: Validate every servers/*.json
        run: node dist/cli.js validate

      - name: Guard against hand-edited generated files
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null | grep -qE '^(LEADERBOARD\.md|badges/)'; then
            echo "::error::LEADERBOARD.md and badges/ are generated by the leaderboard workflow. Revert your changes to them."
            exit 1
          fi
          echo "No generated files were hand-edited."

  score-changed:
    name: Score servers added in this PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Score only what the PR touched, so a registry contributor gets their
      # number and their badge markdown in the PR itself rather than waiting for
      # the nightly leaderboard run.
      - name: Score changed entries
        run: |
          set -euo pipefail
          slugs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'servers/*.json' \
                  | xargs -r -n1 basename \
                  | sed 's/\.json$//' \
                  | tr '\n' ' ')
          if [ -z "${slugs// /}" ]; then
            echo "No registry entries changed."
            exit 0
          fi
          echo "Scoring: $slugs"
          node scripts/pr-comment.mjs $slugs > body.md
          cat body.md

      - name: Comment on the pull request
        if: always() && hashFiles('body.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('body.md', 'utf8');
            const marker = '## tooltax score';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
